services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ewa
      POSTGRES_PASSWORD: ewa
      POSTGRES_DB: ewa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ewa:ewa@postgres:5432/ewa
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production-please-32chars-minimum
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  # Optional Celery worker + beat for scheduled SAP for Me auto-fetch.
  worker:
    build:
      context: ./backend
    command: celery -A app.workers.tasks.celery_app worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://ewa:ewa@postgres:5432/ewa
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production-please-32chars-minimum
    depends_on:
      - backend
      - redis
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
