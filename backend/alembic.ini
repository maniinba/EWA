# Alembic configuration for the EWA Dashboard backend.
[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is overridden at runtime from app settings (see alembic/env.py),
# so this placeholder is only a fallback.
sqlalchemy.url = sqlite:///./ewa.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
